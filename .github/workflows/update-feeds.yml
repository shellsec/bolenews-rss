name: Update BoleNews sources
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: bolenews-feed-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check metadata collector regressions
        run: python3 -m unittest discover -s tests -p collector_test.py
      - name: Collect public index metadata (keep last good on failure)
        id: collect
        continue-on-error: true
        run: python3 tools/collect_web_feeds.py --site all
      - name: Validate declarative catalog and content files
        run: python3 tools/validate_feeds.py
      - name: Commit updated metadata and health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if ! git diff --cached --quiet; then
            git commit -m "Update public feed metadata"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push
          fi
      - name: Report partial collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Some sources failed; successful data and last-good snapshots were preserved."
          exit 1
