name: Discover console homebrew sources
on:
  workflow_dispatch:
  schedule:
    - cron: '37 21 * * *'

permissions:
  contents: write

concurrency:
  group: bolenews-feed-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify discovery rules
        run: python3 -m unittest discover -s tests -p discovery_test.py
      - name: Discover public release feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discover_homebrew.py
      - name: Validate catalogs and feed data
        run: python3 tools/validate_feeds.py
      - name: Publish changed discovery catalogs
        run: |
          git add -- catalogs/switch-homebrew-discovered.json catalogs/switch2-homebrew-discovered.json catalogs/ps5-homebrew-discovered.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update discovered console homebrew feeds'
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
